version: '3.8'

services:
  # 1. Auth Service
  auth-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/services/auth-service
    container_name: infotech-auth-service
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT_AUTH_SERVICE: 5001
    networks:
      - internal-net

  # 2. User Service
  user-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/services/user-service
    container_name: infotech-user-service
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT_USER_SERVICE: 5002
    networks:
      - internal-net

  # 3. Academic Service
  academic-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/services/academic-service
    container_name: infotech-academic-service
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT_ACADEMIC_SERVICE: 5003
    networks:
      - internal-net

  # 4. Notification Service
  notification-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_DIR: backend/services/notification-service
    container_name: infotech-notification-service
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT_NOTIFICATION_SERVICE: 5004
    networks:
      - internal-net

  # 5. Nginx Public Gateway & Web App Proxy
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: infotech-nginx-gateway
    restart: always
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - user-service
      - academic-service
      - notification-service
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
