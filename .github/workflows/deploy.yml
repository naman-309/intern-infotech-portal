name: CI/CD Pipeline — Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Build & Validate Workspaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate & Build React Frontend Bundle
        run: npm run build:frontend

      - name: Syntax & Lint Validation
        run: |
          echo "Validating JavaScript syntax across microservices..."
          node -c backend/services/auth-service/src/app.js
          node -c backend/services/user-service/src/app.js
          node -c backend/services/academic-service/src/app.js
          node -c backend/services/notification-service/src/app.js
          node -c backend/gateway/src/server.js
          echo "All services passed syntax validation."

  deploy-to-ec2:
    name: Deploy Container Fleet to AWS EC2
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Starting deployment on AWS EC2..."

            APP_DIR="/var/www/intern-infotech"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Pull latest code or clone if fresh
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Check if production .env exists, if not initialize from secrets
            if [ ! -f ".env" ]; then
              echo "Creating .env from secure GitHub Actions secrets..."
              {
                echo "NODE_ENV=production"
                echo "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}"
                echo "REDIS_URL=${{ secrets.PROD_REDIS_URL }}"
                echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}"
                echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}"
                echo "JWT_VERIFY_SECRET=${{ secrets.JWT_VERIFY_SECRET }}"
                echo "JWT_RESET_SECRET=${{ secrets.JWT_RESET_SECRET }}"
                echo "CLIENT_ORIGIN=${{ secrets.PROD_CLIENT_ORIGIN }}"
                echo "PUBLIC_API_URL=${{ secrets.PROD_PUBLIC_API_URL }}"
                echo "COOKIE_SECURE=false"
                echo "COOKIE_SAME_SITE=lax"
                echo "COOKIE_DOMAIN=${{ secrets.PROD_COOKIE_DOMAIN }}"
                echo "SMTP_HOST=${{ secrets.SMTP_HOST }}"
                echo "SMTP_PORT=${{ secrets.SMTP_PORT }}"
                echo "SMTP_USER=${{ secrets.SMTP_USER }}"
                echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
                echo "EMAIL_FROM_NAME=\"Intern Infotech Engineering Academy\""
                echo "EMAIL_FROM_ADDRESS=\"${{ secrets.EMAIL_FROM_ADDRESS }}\""
                echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"
                echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
                echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
              } > .env
            fi

            # Detect docker-compose or docker compose
            if command -v docker-compose &> /dev/null; then
              DC="docker-compose"
            else
              DC="docker compose"
            fi

            echo "Using Docker Compose command: $DC"
            echo "Building and launching containers..."
            $DC down
            $DC build
            $DC up -d

            # Run Prisma Migrations inside container
            echo "Applying database schema migrations..."
            sleep 3
            $DC exec -T auth-service npx prisma migrate deploy --schema=backend/shared/prisma/schema.prisma || true

            # Check health
            echo "Verifying service readiness..."
            sleep 5
            curl -f http://localhost/nginx-health || exit 1
            echo "Deployment to AWS EC2 finished successfully!"
